# Despliegue del backend en Render (https://render.com) como "Blueprint".
# Pasos en movil/README.md, seccion "Desplegar el backend".
#
# Las variables con `sync: false` NO llevan valor aqui (esto es publico en
# GitHub): se escriben a mano en el panel de Render, una sola vez.

services:
  - type: web
    name: streetflex-api
    runtime: node
    rootDir: backendST
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: USER_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false
